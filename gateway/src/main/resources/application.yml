spring:
  application:
    name: gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: projets-service
          uri: lb://projets
          predicates:
            - Path=/projet/**, /tache/**
          filters:
            - StripPrefix=0

        - id: collaborations-service
          uri: lb://collaborations
          predicates:
            - Path=/collaboration/**
          filters:
            - StripPrefix=0
server:
  port: 8222

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/



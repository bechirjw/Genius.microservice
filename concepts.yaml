Enregistrer les données:
  Mise à jour:
  - BlocRepository.save(bloc)
Gestion de la base de données:
  CRUD:
    Affectation:
    - CreateBlocWITHFoyer
    Désaffectation:
    - desaffecterBlocFromFoyer
    Mise à jour:
    - desaassignBlocFromFoyer
Méthode HTTP:
  Ressource:
  - Bloc
  Type de requête:
  - PUT
Obter les données:
  Modification:
  - bloc.setFoyer(null)
  Récupération:
  - blocRepository.findById(idBloc).get()
URL:
  Affectation:
  - http://localhost:8089/tpfoyer/bloc/create
  Désaffectation:
  - http://localhost:8089/tpfoyer/bloc/desaffecter-bloc-foyer/1

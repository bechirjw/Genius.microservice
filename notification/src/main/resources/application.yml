eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 5220

spring:
  application:
    name: notification
  config:
    import: optional:configserver:http://localhost:8888
  mvc:
  format:
    date:
      yyyy-MM-dd date-time: yyyy-MM-dd'T'HH:mm:ss



  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/notifications?createDatabaseIfNotExist=true
    username: root
    password:


  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
